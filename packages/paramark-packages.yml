note: >-
  Paramark ships NO client SDK for its API. Searches for "paramark" returned HTTP 404 on
  registry.npmjs.org, pypi.org, rubygems.org and (403/absent) crates.io, and no SDK page exists
  on paramark.com. What the company does publish as open source is a research workbench, not an
  API client: paramark-inc/mmm, an Apache-2.0 Python wrapper around Google's lightweight_mmm
  that runs marketing mix models from a CSV. It is distributed only as a git checkout — its
  pyproject.toml declares no package name or version (only requires-python = "==3.11"), and the
  repository carries zero tags and zero releases — so there is no registry metadata endpoint to
  read a version from. That is recorded as version: null, which means "checked, nothing to
  record", not "not checked". Because none of this is a first-party client library for the
  Paramark API, NO SDKs pointer is emitted.
