apis:
- name: Paramark API
  description: >-
    Paramark's production API, offered as a feature of the Advanced and Enterprise tiers.
    The service is live and answers anonymously at GET /healthz (HTTP 200 {"status":"ok"})
    and is a FastAPI application (server: uvicorn), which means it generates an OpenAPI
    document — but that document is not public: GET https://api.paramark.com/openapi.json,
    /docs and /redoc all return HTTP 401 with www-authenticate: Basic. No developer portal
    or API reference is published on any Paramark host, so no operations, parameters or
    schemas are recorded here. Authorization is described separately from the OpenID
    Connect and OAuth 2.0 metadata Paramark serves anonymously at signin.paramark.com.
  humanURL: https://paramark.com/pricing
  baseURL: https://api.paramark.com
